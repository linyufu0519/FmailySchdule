<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旺咪家行事曆</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">旺咪家行事曆</h1>
    <div class="header-actions">
      <button id="btn-search-toggle" class="icon-btn" title="搜尋" aria-label="搜尋">🔍</button>
      <button id="btn-theme-toggle" class="icon-btn" title="切換深色模式" aria-label="切換深色模式">🌙</button>
    </div>
  </header>

  <!-- 帳號登入列：全家共用一組帳號 -->
  <section id="auth-bar" class="auth-bar">
    <span id="auth-status" class="auth-status">離線模式，尚未設定雲端同步</span>
    <div id="auth-controls" class="auth-controls">
      <input id="auth-email" type="email" placeholder="Email" autocomplete="username" />
      <input id="auth-password" type="password" placeholder="密碼" autocomplete="current-password" />
      <button id="btn-login" class="btn btn-small">登入</button>
      <button id="btn-signup" class="btn btn-small btn-secondary">註冊(首次使用)</button>
      <button id="btn-logout" class="btn btn-small btn-secondary hidden">登出</button>
    </div>
    <p id="auth-message" class="auth-message"></p>
  </section>

  <!-- 搜尋面板 -->
  <section id="search-panel" class="search-panel hidden">
    <input id="search-input" type="text" placeholder="搜尋行程內容或成員姓名" />
    <button id="btn-search" class="btn btn-small">搜尋</button>
    <ul id="search-results" class="search-results"></ul>
  </section>

  <!-- 月曆檢視 -->
  <main id="view-calendar" class="view">
    <nav class="calendar-nav">
      <button id="btn-prev-month" class="icon-btn" aria-label="上一月">◀</button>
      <h2 id="calendar-title" class="calendar-title">2026年1月</h2>
      <button id="btn-next-month" class="icon-btn" aria-label="下一月">▶</button>
    </nav>
    <div class="calendar-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>

    <div class="fab-row">
      <button id="btn-manage-members" class="btn btn-secondary">👪 成員管理</button>
      <button id="btn-add-event" class="btn btn-primary">＋ 新增行程</button>
    </div>
  </main>

  <!-- 成員管理檢視 -->
  <main id="view-members" class="view hidden">
    <nav class="calendar-nav">
      <button id="btn-back-to-calendar" class="icon-btn" aria-label="返回月曆">◀</button>
      <h2 class="calendar-title">家庭成員管理</h2>
      <span></span>
    </nav>
    <ul id="members-list" class="members-list"></ul>
    <div class="fab-row">
      <button id="btn-add-member" class="btn btn-primary">＋ 新增成員</button>
    </div>
  </main>

  <!-- Modal: 當日行程列表 -->
  <div id="modal-day-events" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="day-events-title">日期行程</h3>
        <button class="btn-close" data-close-modal="modal-day-events" aria-label="關閉">✕</button>
      </div>
      <ul id="day-events-list" class="day-events-list"></ul>
      <div class="modal-footer">
        <button id="btn-add-event-in-day" class="btn btn-primary">＋ 新增行程</button>
      </div>
    </div>
  </div>

  <!-- Modal: 行程完整內容 -->
  <div id="modal-event-detail" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>行程詳情</h3>
        <button class="btn-close" data-close-modal="modal-event-detail" aria-label="關閉">✕</button>
      </div>
      <div id="event-detail-body" class="event-detail-body"></div>
    </div>
  </div>

  <!-- Modal: 新增/編輯行程表單 -->
  <div id="modal-event-form" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="event-form-title">新增行程</h3>
        <button class="btn-close" data-close-modal="modal-event-form" aria-label="關閉">✕</button>
      </div>
      <form id="event-form" class="form">
        <input type="hidden" id="event-id" />
        <label class="form-label">日期</label>
        <input type="date" id="event-date" required />

        <label class="form-label">開始時間 - 結束時間</label>
        <div class="time-range">
          <input type="time" id="event-start-time" required />
          <span>～</span>
          <input type="time" id="event-end-time" required />
        </div>

        <label class="form-label">相關成員</label>
        <div id="event-members-checkboxes" class="checkbox-list"></div>

        <label class="form-label">行程內容</label>
        <textarea id="event-content" rows="3" required placeholder="請輸入行程內容"></textarea>

        <label class="form-label">重複規則</label>
        <select id="event-recurrence">
          <option value="none">不重複</option>
          <option value="weekly">每週</option>
          <option value="monthly">每月</option>
        </select>

        <p id="event-conflict-warning" class="conflict-warning hidden">⚠️ 此時段與其他行程重疊，請確認是否為預期安排。</p>

        <div class="form-actions">
          <button type="button" id="btn-delete-event" class="btn btn-danger hidden">刪除</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: 新增/編輯成員表單 -->
  <div id="modal-member-form" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="member-form-title">新增成員</h3>
        <button class="btn-close" data-close-modal="modal-member-form" aria-label="關閉">✕</button>
      </div>
      <form id="member-form" class="form">
        <input type="hidden" id="member-id" />
        <label class="form-label">姓名</label>
        <input type="text" id="member-name" required placeholder="例如：爸爸" />

        <label class="form-label">簡稱（限1個字元）</label>
        <input type="text" id="member-initial" required maxlength="1" placeholder="例如：爸" />

        <label class="form-label">簡稱顏色</label>
        <input type="color" id="member-color" value="#3b82f6" />

        <div class="form-actions">
          <button type="button" id="btn-delete-member" class="btn btn-danger hidden">刪除</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: 通用確認對話框（含二次刪除確認 / 刪除本次 vs 全部） -->
  <div id="modal-confirm" class="modal-overlay hidden">
    <div class="modal-box modal-box-small">
      <p id="confirm-message" class="confirm-message"></p>
      <div id="confirm-actions" class="form-actions confirm-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
